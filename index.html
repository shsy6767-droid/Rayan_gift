<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Rayan Experience</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #161616;
      --gold: #d4af37;
      --text: #e0e0e0;
      --subtext: #a0a0a0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    header {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid #222;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--gold);
      letter-spacing: 3px;
      margin: 0 0 10px 0;
      text-transform: uppercase;
    }

    header p.subtitle {
      font-style: italic;
      color: var(--subtext);
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    .confetti-btn {
      background: linear-gradient(135deg, #d4af37, #f3e5ab);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      margin-bottom: 15px;
      width: auto;
    }

    nav {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.8rem;
      border: 1px solid var(--gold);
      padding: 6px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      text-align: center;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
      border-bottom: 1px dashed #333;
      padding-bottom: 10px;
    }

    .exhibit, .card {
      background-color: var(--card-bg);
      border: 1px solid #222;
      margin-bottom: 40px;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .frame {
      background-color: #000;
      padding: 10px;
      border: 4px solid var(--gold);
      text-align: center;
    }

    .frame img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      display: block;
    }

    .plaque {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #222;
    }

    .plaque h3 {
      margin: 0 0 5px 0;
      font-size: 1.3rem;
      color: #fff;
    }

    .plaque .details {
      font-size: 0.85rem;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .plaque .notes {
      font-size: 0.9rem;
      color: var(--subtext);
      font-style: italic;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: inherit;
    }

    button.submit-btn {
      background: var(--gold);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 15px;
      letter-spacing: 1px;
    }

    /* Secret Unlocked Section */
    #secret-vault {
      display: none;
      border: 2px solid var(--gold);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
      background: linear-gradient(145deg, #18150c, #161616);
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.8rem;
      color: #444;
      border-top: 1px solid #1a1a1a;
    }
  </style>
</head>
<body>

  <header>
    <h1>The Rayan Experience</h1>
    <p class="subtitle">Official Birthday Portal & Archive</p>
    
    <button class="confetti-btn" onclick="launchConfetti()">🎉 Press for Birthday Confetti 🎉</button>

    <nav>
      <a href="#gallery">Museum</a>
      <a href="#trivia">Secret Access</a>
      <a href="#guestbook">Guestbook</a>
    </nav>
  </header>

  <main class="container">

    <section id="trivia">
      <h2 class="section-title">Curator Verification</h2>
      <div class="card">
        <h3>VIP Security Check</h3>
        <p style="color: var(--subtext); font-size: 0.95rem;">
          Is Sigm a good friend of yours?
        </p>
        <input type="text" id="answer-input" placeholder="Type your answer here..." autocomplete="off">
        <button class="submit-btn" onclick="checkAnswer()">SUBMIT ANSWER</button>
        <p id="feedback" style="font-size: 0.85rem; margin-top: 10px; font-style: italic;"></p>
      </div>

      <div id="secret-vault" class="card">
        <h2 style="color: var(--gold); margin-top: 0; text-align: center;">👑 SECRET VAULT UNLOCKED 👑</h2>
        <p style="text-align: center; font-size: 1.1rem; color: #fff; font-weight: bold; margin: 20px 0;">
          "Congrats! You have unlocked a chocolate bar and possibly Claude pro if I feel nice towards you ;)"
        </p>
